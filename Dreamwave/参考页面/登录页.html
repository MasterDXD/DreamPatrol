<style>
        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .input-well {
            background: rgba(5, 20, 36, 0.6);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .input-well:focus-within {
            border-color: rgba(76, 215, 246, 0.5);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 15px rgba(76, 215, 246, 0.2);
        }

        .btn-glow {
            background: linear-gradient(135deg, rgba(87, 27, 193, 0.8), rgba(76, 215, 246, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(87, 27, 193, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-glow:hover {
            box-shadow: 0 6px 20px rgba(76, 215, 246, 0.6);
            transform: scale(0.98);
        }
        
        .btn-glow:active {
            transform: scale(0.95);
        }

<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-tertiary-fixed selection:text-on-tertiary-fixed relative overflow-hidden">
<!-- Immersive Background Image -->
<div class="absolute inset-0 z-0">
<img alt="A mesmerizing nighttime scene featuring a massive, luminous full moon dominating the sky, surrounded by ethereal, soft purple and indigo clouds. The celestial light reflects perfectly on a calm, dark sea, creating a path of silvery light. The atmosphere is profoundly serene, dreamlike, and vast, utilizing a deep cool-toned palette of navys, violets, and ethereal whites to evoke a sense of introspection and subconscious exploration." class="w-full h-full object-cover opacity-80" data-alt="A mesmerizing nighttime scene featuring a massive, luminous full moon dominating the sky, surrounded by ethereal, soft purple and indigo clouds. The celestial light reflects perfectly on a calm, dark sea, creating a path of silvery light. The atmosphere is profoundly serene, dreamlike, and vast, utilizing a deep cool-toned palette of navys, violets, and ethereal whites to evoke a sense of introspection and subconscious exploration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJkn2XOku6f3QzzjTh0Bh-xCKO8_iKIGZCGKGBCzJB3bKFBG_CyxaaQTevbOhsLvH3NHIuKdQ7VoK7Y-AaBmpgQUVllJkjL0dKinMNg3CNVRcXb06ee74nfXCxf5jYePWRB1hILB1GH1_mrVYq-IX7JZDyn51xC1HkkAhy3GY7djLY3aXplP8Kdj1RUl7okE9PRcccD9qkuXXQGLrnJvxSbNlbWfPzNI0AS0HtetHyFF64nW0U_q5fvzKdDq5CaAuHVDujnbOi2ZQ"/>
<!-- Optional overlay to ensure text readability -->
<div class="absolute inset-0 bg-background/30 mix-blend-multiply"></div>
</div>
<!-- Minimalist Header -->
<header class="relative z-10 w-full px-container-margin py-stack-md flex justify-center">
<div class="font-headline-md text-headline-md font-bold tracking-tight text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">nightlight</span>
            巡梦
        </div>
</header>
<!-- Main Content Area -->
<main class="relative z-10 flex-grow flex items-center justify-center px-container-margin py-stack-lg">
<!-- Login Container -->
<div class="glass-card rounded-xl w-full max-w-md p-8 md:p-10 flex flex-col gap-stack-md relative">
<!-- Header Text -->
<div class="text-center space-y-3">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    开启巡梦之旅
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    潜入潜意识的深海，留住那些转瞬即逝的微光。
                </p>
</div>
<!-- Login Form -->
<form class="space-y-stack-sm mt-4">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">账号</label>
<div class="input-well rounded-lg flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline-variant mr-3">account_circle</span>
<input class="bg-transparent border-none w-full text-on-surface focus:ring-0 p-0 font-body-md placeholder-outline-variant" id="email" placeholder="输入您的账号" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">密码</label>
<a class="font-label-sm text-label-sm text-tertiary-fixed hover:text-tertiary transition-colors" href="#">忘记密码?</a>
</div>
<div class="input-well rounded-lg flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline-variant mr-3">lock</span>
<input class="bg-transparent border-none w-full text-on-surface focus:ring-0 p-0 font-body-md placeholder-outline-variant" id="password" placeholder="输入密码" type="password"/>
<button class="text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="btn-glow w-full py-4 rounded-lg font-headline-md text-[18px] text-white mt-6 flex justify-center items-center gap-2" type="submit">
                    进入梦境
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-outline-variant/30 flex-grow"></div>
<span class="font-label-sm text-label-sm text-outline-variant">或</span>
<div class="h-px bg-outline-variant/30 flex-grow"></div>
</div>
<!-- Social / Secondary Actions -->
<div class="flex flex-col gap-4 items-center">
<div class="flex gap-4">
<button class="w-12 h-12 rounded-full input-well flex items-center justify-center hover:bg-surface-container-high transition-colors" title="微信登录">
<span class="material-symbols-outlined text-on-surface-variant">chat</span>
</button>
<button class="w-12 h-12 rounded-full input-well flex items-center justify-center hover:bg-surface-container-high transition-colors" title="Apple 登录">
<span class="material-symbols-outlined text-on-surface-variant">apps</span>
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                    还没有记录过梦境？ <a class="text-tertiary-fixed hover:text-tertiary font-medium transition-colors" href="#">新用户注册</a>
</p>
</div>
</div>
</main>
<!-- Footer Area (Optional minimalist footer if needed, otherwise leave clean) -->
<footer class="relative z-10 w-full px-container-margin py-stack-md text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant/50">
            © 2024 Dream Rover. Guided by the moon.
        </p>
</footer>
