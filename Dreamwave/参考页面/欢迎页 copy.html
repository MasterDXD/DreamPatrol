<script>
        // Simple firefly particle system
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles');
            const particleCount = 25;

            for (let i = 0; i < particleCount; i++) {
                createParticle();
            }

            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties
                const size = Math.random() * 3 + 1;
                const xPos = Math.random() * 100;
                const yPos = Math.random() * 100;
                const duration = Math.random() * 15 + 15;
                const delay = Math.random() * 5;
                const opacity = Math.random() * 0.4 + 0.2;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${xPos}vw`;
                particle.style.top = `${yPos}vh`;
                particle.style.boxShadow = `0 0 ${size * 2}px ${size}px rgba(76, 215, 246, 0.6)`;
                
                // Animation setup
                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 0 },
                    { transform: `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px) scale(1.5)`, opacity: opacity, offset: 0.5 },
                    { transform: `translate(${(Math.random() - 0.5) * 200}px, ${(Math.random() - 0.5) * 200}px) scale(1)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });

                container.appendChild(particle);
            }
        });
    </script>
